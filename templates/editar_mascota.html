{% extends "base.html" %}{% block title %}Editar mascota{% endblock %}{% block content %}
<a class="back" href="{{url_for('mascota',mascota_id=mascota.id)}}">← Volver a {{mascota.nombre}}</a>
<form class="form-card" method="post" enctype="multipart/form-data"><h1>✏️ Editar mascota</h1><div class="two"><div><label>Nombre *</label><input name="nombre" value="{{mascota.nombre}}" required><label>Especie *</label><select name="especie" required><option {% if mascota.especie=='Perro' %}selected{% endif %}>Perro</option><option {% if mascota.especie=='Gato' %}selected{% endif %}>Gato</option><option {% if mascota.especie=='Otro' %}selected{% endif %}>Otro</option></select><label>Raza</label><input name="raza" value="{{mascota.raza or ''}}"><label>Sexo</label><select name="sexo"><option value="" {% if not mascota.sexo %}selected{% endif %}></option><option {% if mascota.sexo=='Hembra' %}selected{% endif %}>Hembra</option><option {% if mascota.sexo=='Macho' %}selected{% endif %}>Macho</option></select></div><div><label>Fecha de nacimiento</label><input type="date" name="nacimiento" value="{{mascota.nacimiento or ''}}"><label>Color</label><input name="color" value="{{mascota.color or ''}}"><label>Peso (kg)</label><input type="number" step="0.1" name="peso" value="{{mascota.peso if mascota.peso is not none else ''}}"><label>Castrado/a</label><select name="castrado"><option value="" {% if not mascota.castrado %}selected{% endif %}></option><option {% if mascota.castrado=='Sí' %}selected{% endif %}>Sí</option><option {% if mascota.castrado=='No' %}selected{% endif %}>No</option></select></div></div><label>Foto nueva (opcional)</label><input type="file" name="foto" accept="image/*"><label>Observaciones</label><textarea name="observaciones" rows="5">{{mascota.observaciones or ''}}</textarea><button class="primary" type="submit">GUARDAR CAMBIOS</button></form>
{% endblock %}
