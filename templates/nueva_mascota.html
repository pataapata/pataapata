{% extends "base.html" %}{% block title %}Nueva mascota{% endblock %}{% block content %}
<form class="form-card" method="post" enctype="multipart/form-data"><h1>🐾 Nueva mascota</h1><div class="two"><div><label>Nombre *</label><input name="nombre" required><label>Especie *</label><select name="especie" required><option>Perro</option><option>Gato</option><option>Otro</option></select><label>Raza</label><input name="raza"><label>Sexo</label><select name="sexo"><option></option><option>Hembra</option><option>Macho</option></select></div><div><label>Fecha de nacimiento</label><input type="date" name="nacimiento"><label>Color</label><input name="color"><label>Peso (kg)</label><input type="number" step="0.1" name="peso"><label>Castrado/a</label><select name="castrado"><option></option><option>Sí</option><option>No</option></select></div></div><label>Foto</label><input type="file" name="foto" accept="image/*"><label>Observaciones</label><textarea name="observaciones" rows="5"></textarea><button class="primary" type="submit">GUARDAR MASCOTA</button></form>
{% endblock %}
